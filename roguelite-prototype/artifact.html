<title>전투 빌드 프로토타입</title>
<style>
:root { color-scheme: dark; --bg:#0c0b10; --panel:#16141d; --line:#2c2936; --text:#ecebf2; --dim:#8e8aa0; --gold:#ffd27a; --accent:#4fd1c5; }
* { box-sizing: border-box; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--text); overflow:hidden; font-family: "Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; }
#c, #g { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); display:block; }
#c { cursor:crosshair; } #g { pointer-events:none; }
#ui { position:absolute; left:50%; top:50%; transform-origin:center; pointer-events:none; }
.screen { position:absolute; inset:0; background:rgba(12,11,16,0.96); display:flex; flex-direction:column; align-items:center; padding:20px 32px; overflow:auto; }
.topbar { width:100%; border-bottom:1px solid var(--line); padding-bottom:10px; margin-bottom:10px; font-size:17px; }
.topbar .stats span { margin-left:18px; } .topbar .hp { color:#ff8a8a; } .topbar .sh { color:#ffd86b; }
.topbar .row { margin-top:6px; } .lbl { color:var(--dim); margin-right:8px; font-size:14px; }
.chip { display:inline-block; border:1px solid #555; border-radius:6px; padding:2px 8px; margin:2px 4px 2px 0; font-size:14px; }
.dim { color:var(--dim); }
.btn { background:#24212d; color:var(--text); border:1px solid #3a3646; border-radius:8px; padding:10px 18px; font-size:17px; cursor:pointer; margin:6px; font-family:inherit; }
.btn:hover:not(:disabled) { background:#302c3c; border-color:var(--gold); }
.btn:disabled { opacity:0.4; cursor:default; }
.btn.big { font-size:21px; padding:14px 30px; } .btn.small { font-size:14px; padding:6px 12px; } .btn.ghost { background:transparent; }
.card-wrap { display:flex; flex-direction:column; align-items:center; margin-top:30px; max-width:1300px; text-align:center; }
.card-wrap h1 { font-size:40px; margin:10px 0; } .lead { font-size:20px; color:#cfcbe0; }
.cards { display:flex; gap:22px; margin:20px 0; flex-wrap:wrap; justify-content:center; }
.cardbox { display:flex; flex-direction:column; align-items:center; }
.card { width:270px; min-height:250px; background:var(--panel); border:2px solid #3a3646; border-radius:14px; padding:20px; color:var(--text); cursor:pointer; text-align:left; font-family:inherit; display:flex; flex-direction:column; gap:10px; }
.card:hover { border-color:var(--gold); transform:translateY(-4px); }
.cname { font-size:26px; font-weight:800; } .cname small { font-size:15px; color:var(--gold); }
.cdesc { font-size:17px; line-height:1.5; color:#d8d4e6; } .cfoot { margin-top:auto; color:var(--dim); font-size:14px; } .grade { font-size:14px; font-weight:700; }
.mapwrap { position:relative; width:1000px; height:640px; flex:none; }
.mapsvg { position:absolute; inset:0; width:100%; height:100%; }
.edge { stroke:#3a3646; stroke-width:3; } .edge.hot { stroke:var(--gold); }
.node { position:absolute; transform:translate(-50%,-50%); width:52px; height:52px; border-radius:50%; background:#1b1922; border:2px solid #3a3646; font-size:24px; cursor:default; font-family:inherit; display:flex; align-items:center; justify-content:center; }
.node.reach { border-color:var(--gold); cursor:pointer; box-shadow:0 0 14px rgba(255,210,122,0.5); animation:pulse 1.2s infinite; }
.node.here { background:#3a3020; } .node.past { opacity:0.35; }
.node .mod { position:absolute; top:52px; font-size:11px; font-style:normal; color:#d27aff; white-space:nowrap; }
@keyframes pulse { 50% { box-shadow:0 0 24px rgba(255,210,122,0.9); } }
.mapside { position:absolute; right:30px; bottom:30px; width:320px; text-align:right; } .hint { color:var(--dim); font-size:15px; margin-bottom:10px; }
.center { display:flex; justify-content:center; align-items:center; height:100%; }
.wide { width:100%; max-width:1300px; }
.shop h2 { margin:6px 0; } .shoprow { display:flex; gap:12px; flex-wrap:wrap; margin:8px 0; }
.shopitem { width:220px; background:var(--panel); border:1px solid #3a3646; border-radius:10px; padding:12px; color:var(--text); text-align:left; cursor:pointer; font-family:inherit; }
.shopitem:hover:not(:disabled) { border-color:var(--gold); } .shopitem:disabled { opacity:0.45; } .price { color:#ffd86b; margin-top:6px; } .iname { font-weight:800; font-size:17px; }
.engrave { background:#121019; border:1px solid var(--line); border-radius:12px; padding:14px; margin-top:12px; position:relative; }
.etitle { font-weight:800; font-size:18px; margin-bottom:6px; }
.egrid { position:relative; width:800px; height:300px; margin:0 auto; }
.elinks { position:absolute; inset:0; width:100%; height:100%; } .elink { stroke:#3a3646; stroke-width:4; } .elink.lit { stroke-width:6; }
.slot { position:absolute; transform:translate(-50%,-50%); width:150px; height:84px; background:#1b1922; border:2px solid #3a3646; border-radius:10px; color:var(--text); cursor:pointer; font-family:inherit; padding:6px; }
.slot.locked { opacity:0.35; cursor:default; } .slot.sel, .bagitem.sel { box-shadow:0 0 0 3px var(--gold); }
.sname { font-size:13px; color:var(--dim); } .linkb { font-size:12px; color:var(--gold); }
.chains { text-align:center; margin:6px 0; font-size:14px; }
.bag { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:8px; }
.bagitem { background:#1b1922; border:2px solid #3a3646; border-radius:8px; color:var(--text); padding:8px 12px; cursor:pointer; font-family:inherit; font-size:15px; display:flex; flex-direction:column; }
.bagitem small { color:var(--dim); font-size:12px; }
.tip { margin-top:10px; min-height:90px; background:#0e0d14; border-radius:8px; padding:10px; font-size:15px; line-height:1.5; }
.tipname { font-weight:800; font-size:17px; } .tipat .on { color:var(--gold); }
.result { display:grid; grid-template-columns:repeat(4, auto); gap:12px 30px; font-size:20px; margin:10px 0; }
.keys { margin:16px auto; font-size:18px; border-collapse:collapse; } .keys td { padding:4px 16px; border-bottom:1px solid var(--line); text-align:left; } .keys td:first-child { color:var(--dim); }
.toast { position:fixed; left:50%; top:12%; transform:translateX(-50%); background:#2a2534; border:1px solid var(--gold); padding:10px 20px; border-radius:8px; z-index:20; font-size:16px; }
.dbg { position:fixed; right:10px; top:10px; z-index:30; background:#16141dee; border:1px solid var(--line); border-radius:10px; padding:8px; display:flex; flex-direction:column; width:200px; }
.codexbtn { float:right; margin-top:-34px; }
.synhint { font-size:14px; color:var(--dim); border-top:1px solid var(--line); padding-top:8px; } .synhint .on { color:var(--gold); }
.codex { position:absolute; inset:0; background:rgba(8,7,12,0.88); z-index:15; display:flex; justify-content:center; align-items:center; pointer-events:auto; }
.codex-in { width:1500px; height:820px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:20px 24px; display:flex; flex-direction:column; }
.codex-head { display:flex; align-items:baseline; gap:16px; } .codex-head h2 { margin:0; font-size:28px; }
.codex-cols { display:grid; grid-template-columns: 1.1fr 1fr 1fr; gap:22px; flex:1; min-height:0; margin-top:12px; }
.codex-cols section { min-height:0; overflow:auto; padding-right:6px; } .codex-cols h3 { margin:6px 0 10px; font-size:19px; }
.clist { display:flex; flex-direction:column; gap:10px; }
.caug { border:1px solid; border-left-width:4px; border-radius:10px; padding:10px 12px; background:#1b1922; }
.cname2 { font-size:19px; font-weight:800; } .cname2 small { color:var(--gold); font-size:13px; }
.cdesc2 { font-size:15px; color:#d8d4e6; line-height:1.45; margin-top:2px; }
.csyn { font-size:14px; color:var(--dim); margin-top:4px; } .csyn.on { color:var(--gold); }
.csyn2 { border:1px solid var(--line); border-radius:10px; padding:10px 12px; background:#1b1922; } .csyn2.on { border-color:var(--gold); }
.csyn2 .have { color:var(--text); font-weight:700; }
.cstats { width:100%; border-collapse:collapse; font-size:15px; font-variant-numeric:tabular-nums; } .cstats td { padding:5px 4px; border-bottom:1px solid var(--line); } .cstats td:last-child { text-align:right; font-weight:700; }
.cbl { font-size:15px; margin:4px 0; }
</style>

<script>
'use strict';
// ===== core.js =====
// ───────── 기본 도구 ─────────
const W = 1600, H = 900;
const cv = document.getElementById('c');
const cx = cv.getContext('2d');
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  for (const c of [cv, document.getElementById('g')]) { c.style.width = (W * s) + 'px'; c.style.height = (H * s) + 'px'; }
  cv.width = W; cv.height = H;
  const ui = document.getElementById('ui');
  ui.style.width = W + 'px'; ui.style.height = H + 'px';
  ui.style.transform = `translate(-50%,-50%) scale(${s})`;
}
addEventListener('resize', fit);

// 시드 난수 (자동 테스트 재현용)
let _seed = (Date.now() & 0xffffffff) >>> 0;
function seed(s) { _seed = s >>> 0; }
function R() { _seed |= 0; _seed = _seed + 0x6D2B79F5 | 0; let t = Math.imul(_seed ^ _seed >>> 15, 1 | _seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const angTo = (a, b) => Math.atan2(b.y - a.y, b.x - a.x);
const pick = arr => arr[Math.floor(R() * arr.length)];
const rint = (a, b) => a + Math.floor(R() * (b - a + 1));
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function wpick(pairs) { // [[item, weight], ...]
  let t = 0; for (const p of pairs) t += p[1];
  let r = R() * t; for (const p of pairs) { r -= p[1]; if (r <= 0) return p[0]; }
  return pairs[pairs.length - 1][0];
}
function angDiff(a, b) { let d = b - a; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2; return d; }

// ───────── 입력 ─────────
const Input = {
  down: new Set(), pressed: new Set(), mx: W / 2, my: H / 2, mouseMoved: 0, bot: null,
  isDown(k) { return this.down.has(k) || (this.bot && this.bot.down.has(k)); },
  hit(k) { return this.pressed.has(k) || (this.bot && this.bot.pressed.has(k)); },
  endFrame() { this.pressed.clear(); if (this.bot) this.bot.pressed.clear(); },
};
addEventListener('keydown', e => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (!Input.down.has(k)) Input.pressed.add(k);
  Input.down.add(k);
  if ([' ', 'Tab'].includes(e.key)) e.preventDefault();
});
addEventListener('keyup', e => { const k = e.key.length === 1 ? e.key.toLowerCase() : e.key; Input.down.delete(k); });
cv.addEventListener('mousemove', e => {
  const r = cv.getBoundingClientRect();
  Input.mx = (e.clientX - r.left) / r.width * W; Input.my = (e.clientY - r.top) / r.height * H; Input.mouseMoved = performance.now();
});
cv.addEventListener('mousedown', e => { const k = 'mouse' + e.button; Input.down.add(k); Input.pressed.add(k); e.preventDefault(); });
addEventListener('mouseup', e => Input.down.delete('mouse' + e.button));
cv.addEventListener('contextmenu', e => e.preventDefault());

// ───────── 손맛 (히트스톱, 흔들림, 슬로모) ─────────
const Juice = {
  stop: 0, shake: 0, zoom: 0, slow: 0, slowScale: 1, flash: 0, flashCol: '#fff', kx: 0, ky: 0, impact: 0, impactCol: '#fff', chroma: 0,
  kickDir(a, s) { this.kx += Math.cos(a) * s; this.ky += Math.sin(a) * s; this.shake = Math.max(this.shake, s * 0.35); },
  impactFrame(t, col) { this.impact = Math.max(this.impact, t); this.impactCol = col || '#fff'; },
  ab(t) { this.chroma = Math.max(this.chroma, t); },
  hitstop(t) { this.stop = Math.max(this.stop, t); },
  kick(s) { this.shake = Math.min(26, Math.max(this.shake, s)); },
  punch(z) { this.zoom = Math.max(this.zoom, z); },
  slowmo(t, sc) { this.slow = Math.max(this.slow, t); this.slowScale = sc; },
  screen(c, t) { this.flash = t; this.flashCol = c; },
  update(rdt) {
    this.shake = Math.max(0, this.shake - rdt * 60);
    this.zoom = Math.max(0, this.zoom - rdt * 0.6);
    this.flash = Math.max(0, this.flash - rdt);
    const k = Math.exp(-rdt * 22); this.kx *= k; this.ky *= k;
    this.impact = Math.max(0, this.impact - rdt); this.chroma = Math.max(0, this.chroma - rdt);
    if (this.slow > 0) this.slow -= rdt;
  },
  scale() { return this.slow > 0 ? this.slowScale : 1; },
};

// ───────── 파티클과 글자 ─────────
const FX = {
  parts: [], texts: [], rings: [], slashes: [], shards: [],
  slash(x, y, ang, arc, r, col, w, life, follow) { this.slashes.push({ x, y, ang, arc, r, col, w, life, max: life, follow }); },
  shatter(x, y, col, n, spd, size) { for (let i = 0; i < n; i++) { const a = R() * Math.PI * 2, s = spd * (0.4 + R()); this.shards.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, rot: R() * 6, vr: (R() - 0.5) * 30, life: 0.7 + R() * 0.5, max: 1.2, col, size: size * (0.5 + R()) }); } },
  radial(x, y, col, n, r0, len) { for (let i = 0; i < n; i++) { const a = R() * Math.PI * 2, s = 900 + R() * 700; this.parts.push({ x: x + Math.cos(a) * r0, y: y + Math.sin(a) * r0, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.16 + R() * 0.1, max: 0.26, col, size: len, line: true }); } },
  burst(x, y, col, n, spd, life, size) {
    for (let i = 0; i < n; i++) {
      const a = R() * Math.PI * 2, s = spd * (0.3 + R() * 0.9);
      this.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: life * (0.6 + R() * 0.6), max: life, col, size: size * (0.6 + R() * 0.8) });
    }
  },
  spark(x, y, ang, col, n, spd) {
    for (let i = 0; i < n; i++) {
      const a = ang + (R() - 0.5) * 1.2, s = spd * (0.5 + R());
      this.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.25 + R() * 0.2, max: 0.4, col, size: 3 + R() * 3, line: true });
    }
  },
  ring(x, y, r0, r1, col, life, w) { this.rings.push({ x, y, r0, r1, col, life, max: life, w: w || 4 }); },
  text(x, y, s, col, big) {
    this.texts.push({ x: x + (R() - 0.5) * 20, y, s: String(s), col, life: big ? 1.1 : 0.75, max: big ? 1.1 : 0.75, big: !!big, vy: big ? -50 : -80, vx: (R() - 0.5) * 60, age: 0 });
  },
  update(dt) {
    for (const p of this.parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.9; p.vy *= 0.9; if (p.vh) p.h = (p.h || 0) + p.vh * dt; p.life -= dt; }
    this.parts = this.parts.filter(p => p.life > 0);
    if (this.parts.length > 900) this.parts.splice(0, this.parts.length - 900);
    for (const t of this.texts) { t.y += t.vy * dt; t.x += (t.vx || 0) * dt; t.vy *= 0.94; t.life -= dt; t.age = (t.age || 0) + dt; }
    for (const s of this.slashes) s.life -= dt; this.slashes = this.slashes.filter(s => s.life > 0);
    for (const p of this.shards) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= Math.exp(-dt * 5); p.vy *= Math.exp(-dt * 5); p.rot += p.vr * dt; p.vr *= 0.95; p.life -= dt; if (p.life <= 0 && window.stampDecal) stampDecal(p); }
    this.shards = this.shards.filter(p => p.life > 0);
    this.texts = this.texts.filter(t => t.life > 0);
    for (const r of this.rings) r.life -= dt;
    this.rings = this.rings.filter(r => r.life > 0);
  },
  draw() {
    for (const s of this.slashes) {
      const k = s.life / s.max, x = s.follow ? s.follow.x : s.x, y = s.follow ? s.follow.y : s.y;
      cx.save(); cx.globalAlpha = Math.min(1, k * 1.6); cx.strokeStyle = s.col; cx.lineCap = 'round'; cx.shadowColor = s.col; cx.shadowBlur = 18;
      const a0 = s.ang - s.arc / 2, a1 = s.ang + s.arc / 2, sweep = (1 - k) * 0.25;
      for (let i = 0; i < 3; i++) { cx.lineWidth = s.w * (1 - i * 0.3) * (0.4 + k * 0.6); cx.beginPath(); cx.arc(x, y, s.r - i * s.w * 0.35, a0 + sweep, a1 + sweep); cx.stroke(); }
      cx.restore();
    }
    for (const p of this.shards) {
      cx.save(); cx.globalAlpha = clamp(p.life / 0.3, 0, 1); cx.translate(p.x, p.y); cx.rotate(p.rot); cx.fillStyle = p.col;
      cx.beginPath(); cx.moveTo(-p.size, -p.size * 0.6); cx.lineTo(p.size, 0); cx.lineTo(-p.size * 0.4, p.size * 0.7); cx.closePath(); cx.fill(); cx.restore();
    }
    for (const r of this.rings) {
      const k = 1 - r.life / r.max;
      cx.globalAlpha = 1 - k; cx.strokeStyle = r.col; cx.lineWidth = r.w * (1 - k) + 1;
      cx.beginPath(); cx.arc(r.x, r.y, lerp(r.r0, r.r1, k), 0, Math.PI * 2); cx.stroke();
    }
    for (const p of this.parts) {
      cx.globalAlpha = clamp(p.life / p.max, 0, 1); cx.fillStyle = p.col; cx.strokeStyle = p.col;
      if (p.line) { cx.lineWidth = p.size * 0.6; cx.beginPath(); cx.moveTo(p.x, p.y); cx.lineTo(p.x - p.vx * 0.03, p.y - p.vy * 0.03); cx.stroke(); }
      else cx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    cx.globalAlpha = 1;
    cx.textAlign = 'center';
    for (const t of this.texts) {
      const a = clamp(t.life / t.max * 1.6, 0, 1); cx.globalAlpha = a;
      const pop = 1 + Math.max(0, 0.12 - (t.age || 0)) / 0.12 * (t.big ? 0.9 : 0.6);
      cx.font = `900 ${Math.round((t.big ? 34 : 22) * pop)}px "Pretendard", "Noto Sans KR", sans-serif`;
      cx.lineWidth = 5; cx.strokeStyle = '#0b0b10'; cx.strokeText(t.s, t.x, t.y); cx.fillStyle = t.col; cx.fillText(t.s, t.x, t.y);
    }
    cx.globalAlpha = 1;
  },
  clear() { this.parts = []; this.texts = []; this.rings = []; this.slashes = []; this.shards = []; },
};

// ───────── 소리 (코드로 만든 효과음) ─────────
const Sfx = {
  ac: null, on: true,
  init() { if (!this.ac) try { this.ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.on = false; } },
  tone(f0, f1, dur, type, vol) {
    if (!this.on || !this.ac) return;
    const a = this.ac, o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur);
  },
  noise(dur, vol, hp) {
    if (!this.on || !this.ac) return;
    const a = this.ac, n = a.sampleRate * dur, b = a.createBuffer(1, n, a.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = a.createBufferSource(), g = a.createGain(), f = a.createBiquadFilter();
    f.type = 'highpass'; f.frequency.value = hp || 800; s.buffer = b; g.gain.value = vol;
    s.connect(f).connect(g).connect(a.destination); s.start();
  },
  hit(p) { p = p || 1; this.noise(0.08, 0.25, 1200 * p); this.tone(180 * p, 60, 0.08, 'square', 0.12); this.tone(90 * p, 40, 0.12, 'sine', 0.18); },
  thud() { this.tone(120, 35, 0.25, 'sine', 0.4); this.noise(0.15, 0.3, 300); },
  crunch() { this.noise(0.18, 0.28, 500); this.tone(260, 50, 0.15, 'triangle', 0.15); },
  crit() { this.noise(0.12, 0.3, 600); this.tone(300, 80, 0.12, 'sawtooth', 0.12); },
  parry() { this.tone(1400, 900, 0.18, 'triangle', 0.25); this.tone(2100, 1600, 0.12, 'sine', 0.15); },
  gold() { this.tone(900, 1800, 0.3, 'triangle', 0.25); this.tone(600, 1200, 0.35, 'sine', 0.2); },
  dash() { this.noise(0.12, 0.12, 2500); },
  swing(p) { this.noise(0.07, 0.09, 2600 * (p || 1)); },
  hurt() { this.tone(220, 70, 0.2, 'sawtooth', 0.2); },
  boom() { this.noise(0.35, 0.35, 120); this.tone(90, 30, 0.35, 'sine', 0.3); },
  groggy() { this.tone(500, 120, 0.5, 'square', 0.15); },
  pick() { this.tone(700, 1100, 0.08, 'sine', 0.12); },
};

let Run = null;
function newRun(seedVal) {
  if (seedVal != null) seed(seedVal);
  Run = {
    tier: 1, row: 0, floor: 0, node: null, map: null,
    hp: 100, shards: 0, rerolls: 0,
    blessings: {}, augs: {},
    engr: { a1: null, a2: null, a3: null, dash: null, parry: null, counter: null, core: null },
    open: new Set(['a1', 'parry', 'core']),
    bag: [], bagMax: 2,
    stones: 0,
    kills: 0, parries: 0, golds: 0, groggies: 0, maxHit: 0, time: 0,
    upNext: 0, sagaOn: false, history: [],
  };
  recalc();
  Run.hp = St.maxHp;
}
let St = {}, ActMods = {}, Links = {};

function blankEff() { return { dmg: 0, crit: 0, poise: 0, vs: {}, critCond: [], poiseCond: [], dashCd: 0, guard: 0 }; }
function addEff(t, e, m) {
  if (!e) return;
  if (e.dmg) t.dmg += e.dmg * m;
  if (e.crit) { if (e.critVs) t.critCond.push({ vs: e.critVs, v: e.crit * m }); else t.crit += e.crit * m; }
  if (e.poise) { if (e.poiseVs) t.poiseCond.push({ vs: e.poiseVs, v: e.poise * m }); else t.poise += e.poise * m; }
  if (e.dashCd) t.dashCd += e.dashCd * m;
  if (e.guard) t.guard += e.guard * m;
  if (e.vs) for (const k in e.vs) t.vs[k] = (t.vs[k] || 0) + e.vs[k] * m;
}
function itemLvMul(inst) { return 1 + 0.5 * (inst.lv || 0); }

function recalc() {
  const s = { maxHp: 100, dmg: 0, atkSpd: 1, move: 1, dashCd: 0.55, ultGain: 1, parryWin: 0.18, parryWinBase: 0.18, crit: 0.05, critDmg: 1.5,
    firePow: 0, icePow: 0, lightPow: 0, fireDmg: 0, physDmg: 0, poise: 0, stance: 0, shardMul: 0, chillAmp: 0, shockBounce: 0, maxHpMul: 0, dmgTaken: 1 };
  const A = Run.augs;
  if (A.catch) { s.parryWin += 0.06; s.parryWinBase += 0.06; }
  Run.syn = new Set(SYNERGIES.filter(x => x.need.every(n => A[n])).map(x => x.id));
  if (A.redsteel && !Run.syn.has('ironwall')) { s.parryWin -= 0.04; s.parryWinBase -= 0.04; }
  for (const id in Run.blessings) { const b = BLESSINGS.find(x => x.id === id); for (let i = 0; i < Run.blessings[id]; i++) b.apply(s); }
  if (A.topple) s.stance += 0.4;
  if (A.plate) s.dmgTaken *= 0.88;
  if (A.fate) { s.crit += 0.15; s.critDmg += 0.5; }
  if (Run.sagaOn) s.dmgTaken *= 1.1;

  // 이음: 이어진 두 자리에 같은 계열이면 둘 다 +20%
  const E = Run.engr; const link = {};
  for (const sl of SLOTS) link[sl.k] = 1;
  for (const sl of SLOTS) {
    const it = E[sl.k]; if (!it) continue; const el = ITEM[it.id].elem; if (el === 'none') continue;
    for (const o of sl.links) { const jt = E[o]; if (jt && ITEM[jt.id].elem === el) { link[sl.k] = 1.2; } }
  }
  // 심 자리 둘 잇기 (심 쪽도 같이 +20%)
  if (E.core) { const el = ITEM[E.core.id].elem; if (el !== 'none' && SLOTS.some(sl => sl.k !== 'core' && E[sl.k] && ITEM[E[sl.k].id].elem === el)) link.core = 1.2; }
  Links = link;

  ActMods = {};
  for (const sl of SLOTS) ActMods[sl.k] = blankEff();
  for (const sl of SLOTS) {
    const inst = E[sl.k]; if (!inst) continue;
    const it = ITEM[inst.id]; const m = itemLvMul(inst) * link[sl.k];
    for (const k in it.base) s[k] = (s[k] || 0) + it.base[k] * m;
    const at = it.at[sl.k] || it.at.any;
    if (sl.k !== 'core') addEff(ActMods[sl.k], at, m);
  }
  // 사슬 셋 → 끝 동작에 이음 마무리
  Run.chains = [];
  for (const ch of CHAINS) {
    const its = ch.seq.map(k => E[k]);
    if (its.every(Boolean)) {
      const el = ITEM[its[0].id].elem;
      if (el !== 'none' && its.every(i => ITEM[i.id].elem === el)) {
        Run.chains.push({ ...ch, elem: el });
        if (el === 'phys') ActMods[ch.end].poise += 0.6;
        else ActMods[ch.end].vs[{ fire: 'burn', ice: 'chill', light: 'shock' }[el]] = (ActMods[ch.end].vs[{ fire: 'burn', ice: 'chill', light: 'shock' }[el]] || 0) + 0.4;
      }
    }
  }
  s.dashCd = s.dashCd * (1 + (ActMods.dash.dashCd || 0));
  s.maxHp = Math.round(s.maxHp * (1 + s.maxHpMul));
  s.atkSpd = Math.max(0.5, s.atkSpd);
  St = s;
  if (Run.hp > St.maxHp) Run.hp = St.maxHp;
}

// ───────── 투사체 ─────────
function updateProjs(dt) {

  for (const p of World.projs) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (p.x < 0 || p.y < 0 || p.x > A.w || p.y > A.h) p.life = 0;
    for (const pl of A.pillars) if (Math.hypot(p.x - pl.x, p.y - pl.y) < pl.r + p.r) { p.life = 0; FX.burst(p.x, p.y, p.col, 5, 120, 0.2, 3); }
    if (p.life <= 0) continue;
    if (p.owner === 'enemy') {
      if (Math.hypot(p.x - P.x, p.y - P.y) < p.r + P.r) {
        const r = playerHit({ dmg: p.dmg, color: p.color, src: p.src && !p.src.dead ? p.src : null, proj: p });
        if (r === 'hit') p.life = 0;
      }
    } else {
      for (const e of World.enemies) {
        if (e.dead || p.hitSet.has(e)) continue;
        if (Math.hypot(p.x - e.x, p.y - e.y) < p.r + e.r) {
          p.hitSet.add(e);
          dealDamage(e, { base: p.dmg, gen: p.gen, act: p.wave ? null : null, ang: Math.atan2(p.vy, p.vx), kb: 180, poise: p.wave ? 10 : 25 });
          if (!p.pierce) { p.life = 0; break; }

  if (World.projs.filter(p => p.owner === 'player').length > 80) { let n = 0; World.projs = World.projs.filter(p => p.owner !== 'player' || (++n > World.projs.filter(q => q.owner === 'player').length - 80)); }
}

function updateWorld(dt) {

  for (const m of World.marks) m.t -= dt; World.marks = World.marks.filter(m => m.t > 0);
  for (const e of World.enemies) updateEnemy(e, dt);
  updateHits(dt); updateProjs(dt);

let Scene = 'title';

const NODE_INFO = {

// ───────── 4장 계층 지도 ─────────
function genMap() {
  const rows = []; let id = 0;
  const mk = (row, col, type) => ({ id: id++, row, col, type, next: [], mods: [], elite: row >= 6 });
  for (let r = 1; r <= 10; r++) rows[r] = [];
  const seg = (r0) => {
    let starts = shuffle([0, 1, 2, 3, 4, 5, 6]).slice(0, 4).sort((a, b) => a - b);
    const paths = starts.map(c => [c]);
    for (let r = 1; r < 4; r++) {
      for (let i = 0; i < 4; i++) paths[i].push(clamp(paths[i][r - 1] + rint(-1, 1), 0, 6));
      for (let i = 1; i < 4; i++) if (paths[i][r] < paths[i - 1][r]) paths[i][r] = paths[i - 1][r];
    }
    for (let r = 0; r < 4; r++) {
      const cols = [...new Set(paths.map(p => p[r]))];
      for (const c of cols) rows[r0 + r].push(mk(r0 + r, c, 'fight'));
    }
    const find = (r, c) => rows[r].find(n => n.col === c);
    for (const p of paths) for (let r = 0; r < 3; r++) { const a = find(r0 + r, p[r]), b = find(r0 + r + 1, p[r + 1]); if (!a.next.includes(b.id)) a.next.push(b.id); }
  };
  seg(1); seg(6);
  rows[5] = [mk(5, 3, 'boss')]; rows[10] = [mk(10, 3, 'boss')];
  for (const n of rows[4]) n.next.push(rows[5][0].id);
  rows[5][0].next = rows[6].map(n => n.id);
  for (const n of rows[9]) n.next.push(rows[10][0].id);
  const all = rows.flat().filter(Boolean); const byId = Object.fromEntries(all.map(n => [n.id, n]));
  const parents = id => all.filter(n => n.next.includes(id));
  // 칸 종류 (4.2 비율, 4.3 규칙)
  for (let r = 2; r <= 9; r++) {
    if (r === 5 || r === 6) continue;
    const w = r < 5 ? [['fight', 55], ['curse', 8], ['shop', 12], ['rest', 12], ['event', 13]] : [['fight', 50], ['curse', 12], ['shop', 12], ['rest', 12], ['event', 14]];
    for (const n of rows[r]) n.type = wpick(w);
    if ((r === 4 || r === 9) && rows[r].length >= 2) { const s = shuffle(rows[r].slice()); s[0].type = 'shop'; s[1].type = 'rest'; }
  }
  const nonCombat = t => ['shop', 'rest', 'event'].includes(t);
  for (let r = 2; r <= 9; r++) for (const n of rows[r]) if (nonCombat(n.type) && parents(n.id).some(p => nonCombat(p.type)) && !(r === 4 || r === 9)) n.type = 'fight';
  // 변형자
  for (const n of all) {
    if (n.type === 'fight' && R() < (n.elite ? 0.6 : 0.4)) n.mods = [pick(MODIFIERS).id];
    if (n.type === 'curse') n.mods = shuffle(MODIFIERS.map(m => m.id)).slice(0, 2);
  }
  return { rows, byId };
}
function nodeKind(n) { return n.type === 'fight' && n.elite ? 'elite' : n.type; }

  const eb = h('button', 'btn', '동작 각인 보기'); eb.onclick = () => showEngraveOnly(); side.appendChild(eb);

// ───────── 전투 클리어 → 보상 ─────────
function fightCleared() {
  const n = Run.node; const k = n.type;
  if (k === 'final') { endRun(true); return; }
  let base = k === 'boss' ? (n.row === 5 ? 40 : 60) : n.elite ? 25 : 15;
  if (n.type === 'curse') base *= 2;
  const heavy = (n.mods || []).some(m => MOD[m].heavy), light = (n.mods || []).some(m => !MOD[m].heavy);
  if (heavy) base *= 1.5; else if (light) base *= 1.2;
  base = Math.round(base * (1 + St.shardMul));

// ── 투영: 게임 좌표(x, y, 높이 h) → 화면 좌표
function proj(x, y, h) {
  const d = G3.cam.position.distanceTo(G3.tmp.set(x, h || 0, y));

}
function screenToWorld(sx, sy) {

  const o = G3.cam.position, d = nd.sub(o).normalize(); const t = -o.y / d.y;

// ===== main.js =====
// ───────── 메인 루프, 그리기, 화면 표시, 디버그, 자동 플레이 ─────────
let paused = false, god = false;
const Cam = { x: 0, y: 0 };
function updateCam(dt) {
  const A = World.arena; if (!A) return;
  const sp = G3.span(), m = 70;
  const lead = 50; const fa = P.face || 0; let tx = P.x + Math.cos(fa) * lead, ty = P.y + Math.sin(fa) * lead * 0.7;
  const b = World.boss; if (b && !b.dead) { tx = lerp(tx, b.x, 0.3); ty = lerp(ty, b.y, 0.3); } // 보스는 화면에 같이 잡아요
  tx = sp.w >= A.w + m * 2 ? A.w / 2 : clamp(tx, sp.w / 2 - m, A.w - sp.w / 2 + m);
  ty = sp.far + sp.near >= A.h + m * 2 ? A.h / 2 + (sp.far - sp.near) / 2 : clamp(ty, sp.far - m, A.h - sp.near + m);
  Cam.x = lerp(Cam.x, tx, Math.min(1, dt * 7)); Cam.y = lerp(Cam.y, ty, Math.min(1, dt * 7));

// 바닥 자국 (처치 흔적, 균열, 그을음)
function stampDecal(p) { if (!World.decal) return; const g = World.decal.getContext('2d'); g.save(); g.globalAlpha = 0.5; g.translate(p.x, p.y); g.rotate(p.rot); g.fillStyle = p.col; g.beginPath(); g.moveTo(-p.size, -p.size * 0.6); g.lineTo(p.size, 0); g.lineTo(-p.size * 0.4, p.size * 0.7); g.closePath(); g.fill(); g.restore(); G3.decDirty = true; }
function splat(x, y, col, r, kind) {
  if (!World.decal) return; const g = World.decal.getContext('2d'); g.save();
  if (kind === 'crack') { g.strokeStyle = 'rgba(0,0,0,0.45)'; g.lineWidth = 3; for (let i = 0; i < 9; i++) { const a = R() * Math.PI * 2; g.beginPath(); g.moveTo(x, y); let px = x, py = y; for (let j = 0; j < 4; j++) { px += Math.cos(a + (R() - 0.5) * 0.8) * r / 4; py += Math.sin(a + (R() - 0.5) * 0.8) * r / 4; g.lineTo(px, py); } g.stroke(); } }
  else if (kind === 'scorch') { const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, 'rgba(0,0,0,0.6)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); }
  else { g.globalAlpha = 0.35; g.fillStyle = col; for (let i = 0; i < 7; i++) { const a = R() * Math.PI * 2, d = R() * r; g.beginPath(); g.ellipse(x + Math.cos(a) * d, y + Math.sin(a) * d, r * (0.2 + R() * 0.3), r * (0.12 + R() * 0.2), a, 0, Math.PI * 2); g.fill(); } }
  g.restore(); G3.decDirty = true;
}

// ───────── 화면 표시 (HUD) ─────────
function bar(x, y, w, hgt, k, col, bg) { cx.fillStyle = bg || '#0008'; cx.fillRect(x, y, w, hgt); cx.fillStyle = col; cx.fillRect(x, y, w * clamp(k, 0, 1), hgt); }
function drawHUD() {
  cx.textAlign = 'left'; cx.font = '700 18px sans-serif';

  bar(30, 52, 340, 10, P.ult, P.ult >= 1 ? '#ffb36b' : '#a86a3a');
  const md = Run.augs.overcharge ? 2 : 1;
  for (let i = 0; i < md; i++) { cx.fillStyle = i < P.dashCharges ? '#9fe8ff' : '#33404a'; cx.fillRect(30 + i * 26, 70, 20, 8); }
  cx.fillStyle = '#ccc'; cx.font = '600 14px sans-serif'; cx.fillText('대시', 30 + md * 26 + 4, 79);

  cx.fillText('회전베기 (Q)', 150 + ms * 26 + 4, 79);
  if (P.ult >= 1) { cx.fillStyle = '#ffb36b'; cx.font = '800 16px sans-serif'; cx.fillText('궁극기 준비 (R)', 30, 102); }
  // 화면 밖 적 표시
  for (const e of World.enemies) {

    if (sx > 0 && sx < W && sy > 0 && sy < H) continue;
    const a = Math.atan2(sy - H / 2, sx - W / 2); const ex = clamp(sx, 24, W - 24), ey = clamp(sy, 120, H - 90);
    cx.save(); cx.translate(ex, ey); cx.rotate(a); cx.fillStyle = e.boss ? '#ff5a5a' : e.atk && e.atk.phase === 'tele' ? COLMAP[e.atk.color] || '#fff' : '#d0c8e0';
    cx.beginPath(); cx.moveTo(12, 0); cx.lineTo(-8, -9); cx.lineTo(-8, 9); cx.closePath(); cx.fill(); cx.restore();
  }
  // 층 정보

  const kindName = World.kind === 'final' ? '최종 보스' : World.kind === 'boss' ? '보스' : (Run.node && Run.node.type === 'curse' ? '저주 전투' : Run.node && Run.node.elite ? '정예 전투' : '전투');
  cx.fillText(`${Run.floor}층 · ${kindName}`, W - 30, 42);
  cx.font = '600 16px sans-serif'; cx.fillStyle = '#ffd86b'; cx.fillText(`파편 ${Run.shards}`, W - 30, 66);
  if (World.mods.length) { cx.fillStyle = '#d27aff'; cx.fillText('변형자: ' + World.mods.map(m => MOD[m].name).join(', '), W - 30, 88); }
  if (World.info && World.info.compo) { cx.fillStyle = '#9a96a8'; cx.fillText(World.info.compo, W - 30, 108); }
  // 타격 수
  if (P.hits >= 3) { const k = clamp(P.hitT / 1.6, 0, 1); const pop = 1 + Math.max(0, (P.hitPop || 0)) * 0.6; cx.save(); cx.translate(W - 60, 190); cx.scale(pop, pop); cx.textAlign = 'right'; cx.globalAlpha = 0.4 + k * 0.6;
    cx.font = '900 46px sans-serif'; cx.fillStyle = P.hits >= 30 ? '#ff9a3d' : P.hits >= 15 ? '#ffd27a' : '#ffffff'; cx.fillText(P.hits, 0, 0); cx.font = '800 16px sans-serif'; cx.fillStyle = '#c9c4d6'; cx.fillText('연속 타격', 0, 22);
    cx.fillStyle = '#ffffff33'; cx.fillRect(-110, 30, 110, 4); cx.fillStyle = '#ffd27a'; cx.fillRect(-110 * k, 30, 110 * k, 4); cx.restore(); }
  // 반격 창
  if (P.counterT > 0) { cx.textAlign = 'center'; cx.font = '900 26px sans-serif'; cx.fillStyle = '#ffd27a'; cx.fillText('반격!', W / 2, H - 150); }
  if (P.chainStacks > 0 && Run.augs.chainparry) { cx.textAlign = 'center'; cx.font = '700 16px sans-serif'; cx.fillStyle = '#ffd27a'; cx.fillText(`연속 응수 ${P.chainStacks}`, W / 2, H - 125); }
  // 동작 각인 줄
  const keys = ['dash', 'a1', 'a2', 'a3', 'parry', 'counter', 'core'];
  const curAct = P.act ? (P.act.type === 'swing' ? (P.act.counter ? 'counter' : P.act.act) : P.act.type === 'thrust' ? 'dash' : P.act.type === 'parry' ? 'parry' : null) : (P.dashT > 0 ? 'dash' : null);
  keys.forEach((k, i) => {
    const x = W / 2 - 3.5 * 120 + i * 120, y = H - 64; const inst = Run.engr[k]; const open = Run.open.has(k);
    cx.fillStyle = curAct === k || (P.act && P.act.counter && k === P.act.act) ? '#2b3a48' : '#14121add'; cx.fillRect(x, y, 112, 46);
    cx.strokeStyle = inst ? ELEM[ITEM[inst.id].elem].col : open ? '#444' : '#222'; cx.lineWidth = Links[k] > 1 ? 3 : 1.5; cx.strokeRect(x, y, 112, 46);
    cx.textAlign = 'center'; cx.font = '700 13px sans-serif'; cx.fillStyle = '#aaa'; cx.fillText(SLOT[k].name, x + 56, y + 17);
    cx.font = '700 13px sans-serif'; cx.fillStyle = inst ? ELEM[ITEM[inst.id].elem].col : '#555'; cx.fillText(inst ? ITEM[inst.id].name : open ? '비어 있음' : '잠김', x + 56, y + 36);
  });
  // 보스 바
  const b = World.boss;
  if (b && !b.dead) {
    const w = 760, x = W / 2 - w / 2, y = 34;
    cx.textAlign = 'center'; cx.font = '800 20px sans-serif'; cx.fillStyle = '#fff'; cx.fillText(b.title + (b.phase > 1 ? ` · 페이즈 ${b.phase}` : ''), W / 2, y - 6);
    bar(x, y, w, 16, b.hp / b.maxHp, '#d04848'); bar(x, y + 20, w, 8, b.groggy > 0 ? 1 : b.stance / b.stanceMax, b.groggy > 0 ? '#ffffff' : '#ffd27a');
  }

  // 보유 증강 (항상 표시)
  { let x = 30, y = 118; cx.textAlign = 'left'; cx.font = '700 13px sans-serif';

      cx.fillStyle = lit ? '#ffd27a' : '#e6e3ee'; cx.fillText(label, x + 8, y + 16); x += w + 6;
    }

  }
  if (paused) { cx.fillStyle = '#000a'; cx.fillRect(0, 0, W, H); cx.textAlign = 'center'; cx.fillStyle = '#fff'; cx.font = '900 48px sans-serif'; cx.fillText('일시정지', W / 2, H / 2); cx.font = '600 18px sans-serif'; cx.fillText('Esc로 계속', W / 2, H / 2 + 40); }
}

// ───────── 디버그 패널 (` 키) ─────────
function toggleDebug() {
  let d = document.getElementById('dbg'); if (d) { d.remove(); return; }
  d = h('div', 'dbg'); d.id = 'dbg';
  const btn = (t, f) => { const b = h('button', 'btn small', t); b.onclick = () => { f(); }; d.appendChild(b); };
  btn('무적 켜기/끄기', () => { god = !god; });
  btn('이 층 즉시 클리어', () => { if (Scene === 'fight') { World.queue = []; World.enemies.forEach(e => { if (!e.dead) { e.hp = 0; killEnemy(e); } }); } });
  btn('파편 +500', () => { Run.shards += 500; });
  btn('무작위 증강', () => { const a = pick(AUGMENTS.filter(x => (Run.augs[x.id] || 0) < x.max)); if (a) { takeAug(a.id); flashMsg(a.name); } });
  btn('무작위 인장 (가방)', () => { if (Run.bag.length < Run.bagMax) { Run.bag.push({ id: pick(ITEMS).id, lv: 0 }); flashMsg('가방에 넣음'); } });
  btn('모든 각인 자리 열기', () => { SLOTS.forEach(s => Run.open.add(s.k)); recalc(); });
  btn('체력 가득', () => { Run.hp = St.maxHp; });
  btn('궁극기 가득', () => { P.ult = 1; });
  btn('닫기', () => d.remove());
  document.body.appendChild(d);
}
addEventListener('keydown', e => {
  if (e.key === '`') toggleDebug();
  if (e.key === 'Tab') { e.preventDefault(); toggleCodex(); if (Scene === 'fight' && !document.getElementById('codex')) UI.style.pointerEvents = 'none'; return; }
  if (e.key === 'Escape' && document.getElementById('codex')) { toggleCodex(); if (Scene === 'fight') UI.style.pointerEvents = 'none'; return; }
  if (e.key === 'Escape' && Scene === 'fight') paused = !paused;
});

// ───────── 자동 플레이 (검증용) ─────────
function makeBot() {
  const bot = { down: new Set(), pressed: new Set(), aim: null, lastParry: -9, think() {
    this.down.clear(); this.aim = null;
    if (Scene !== 'fight' || !P.alive) return;
    const foes = World.enemies.filter(e => !e.dead);
    if (!foes.length) return;
    let tgt = foes.sort((a, b) => dist(a, P) - dist(b, P))[0];
    const d = dist(tgt, P); this.aim = angTo(P, tgt);
    // 위협 판단
    let threat = null;
    for (const e of foes) {
      if (e.atk && e.atk.phase === 'tele' && !e.atk.noFlash) {
        const left = e.atk.tele - e.atk.t; const ed = dist(e, P);
        const reach = e.boss ? (e.atk.name === 'slam' ? 260 : e.atk.name === 'sweep' ? 820 : e.atk.name === 'charge' ? 700 : e.atk.name === 'fan' ? 0 : 200) : e.atk.name === 'shot' ? 0 : e.atk.name === 'slam' ? 170 : e.atk.name === 'boom' ? 140 : e.atk.name === 'lunge' ? 220 : 160;
        const lungeLike = e.atk.name === 'lunge' || e.atk.name === 'charge';
        if (ed < reach && left < (e.atk.color === 'red' ? 0.2 : 0.09) && !(lungeLike && ed > 110)) threat = { e, left };
      }
      if (e.atk && e.atk.phase === 'act' && (e.atk.name === 'lunge' || e.atk.name === 'charge') && dist(e, P) < 75 + e.r) threat = { e, left: 0 };
    }
    for (const p of World.projs) if (p.owner === 'enemy' && Math.hypot(p.x - P.x, p.y - P.y) < 70) threat = { proj: p, left: 0, color: p.color };
    if (threat && gameTime - this.lastParry > 0.25) {
      const col = threat.proj ? threat.color : threat.e.atk.color;
      if (col === 'red' && !Run.augs.redsteel) { this.pressed.add(' '); const away = angTo(threat.e || P, P) + (R() - 0.5); this.down.add(Math.cos(away) > 0 ? 'd' : 'a'); this.down.add(Math.sin(away) > 0 ? 's' : 'w'); }
      else { this.pressed.add('k'); if (threat.e) this.aim = angTo(P, threat.e); }
      this.lastParry = gameTime; return;
    }
    if (P.ult >= 1 && foes.filter(e => dist(e, P) < 300).length >= 3) this.pressed.add('r');
    if (P.spinCharges > 0 && foes.filter(e => dist(e, P) < 150).length >= 3) this.pressed.add('q');
    const want = tgt.boss ? 130 : 80;
    if (d > want + tgt.r) { const a = this.aim; if (Math.cos(a) > 0.38) this.down.add('d'); if (Math.cos(a) < -0.38) this.down.add('a'); if (Math.sin(a) > 0.38) this.down.add('s'); if (Math.sin(a) < -0.38) this.down.add('w'); }
    else if (!P.act || P.act.phase === 'rec') this.pressed.add('j');
  } };
  return bot;
}
function autoEngrave() {
  for (let i = Run.bag.length - 1; i >= 0; i--) {
    const it = ITEM[Run.bag[i].id];
    const slot = KIND_SLOTS[it.kind].find(k => Run.open.has(k) && !Run.engr[k]);
    if (slot) { Run.engr[slot] = Run.bag.splice(i, 1)[0]; }
  }
  recalc();
}
function autoShop(stock, draw, redraw) {
  for (const s of stock) { const price = Math.round(s.it.price * (Run.augs.regular ? 0.8 : 1)); if (!s.sold && Run.shards >= price + 20 && Run.bag.length < Run.bagMax) { Run.shards -= price; s.sold = true; Run.bag.push({ id: s.it.id, lv: 0 }); autoEngrave(); } }
  const lock = SLOT_UNLOCK_ORDER.find(s => !Run.open.has(s)); if (lock && Run.shards >= 100) { Run.shards -= 100; Run.open.add(lock); autoEngrave(); }
  if (Run.shards >= 60 && Run.engr.a1) { Run.shards -= 60; Run.stones++; useStone('a1', () => 0); }
  setTimeout(() => { Sel = null; afterFloor(); }, 20);
}

// ───────── 루프 ─────────
let last = performance.now();
function frame(now) {
  const rdt = Math.min(0.033, (now - last) / 1000); last = now;
  Juice.update(rdt);
  if (Input.bot) Input.bot.think();
  if (Scene === 'fight' && World.arena) {
    if (!paused) {
      if (Juice.stop > 0) Juice.stop -= rdt;
      else {
        const sdt = rdt * Juice.scale() * (window.__speed || 1);
        const steps = Math.ceil((window.__speed || 1));
        for (let i = 0; i < steps; i++) {
          const d = sdt / steps; gameTime += d; Run.time += d;
          if (god) { Run.hp = St.maxHp; }
          updatePlayer(d); updateWorld(d); updateLater(d); FX.update(d);
          if (Scene !== 'fight') break;
        }
      }
      updateCam(rdt);
    }
    if (World.arena) { drawWorld(); drawHUD(); }
  } else drawIdle();
  Input.endFrame();
  requestAnimationFrame(frame);
}

window.__proto = {
  get run() { return Run; }, get world() { return World; }, get player() { return P; }, get scene() { return Scene; },
  start(s) { startRun(s); }, god(v) { god = v; }, auto(on) { Input.bot = on ? makeBot() : null; window.__auto = !!on; },
  clear() { World.queue = []; World.enemies.forEach(e => { if (!e.dead) { e.hp = 0; killEnemy(e); } }); },
  enter(id) { const n = Run.map.byId[id]; if (n) enterNode(n); }, reach() { return reachable(); },
  aug(id) { takeAug(id); }, item(id, slot) { Run.open.add(slot); Run.engr[slot] = { id, lv: 0 }; recalc(); },
};
fit(); showTitle(); requestAnimationFrame(frame);
